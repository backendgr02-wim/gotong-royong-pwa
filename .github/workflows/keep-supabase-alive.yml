name: Keep Supabase Alive

on:
  schedule:
    # Every 3 days at 06:00 UTC (13:00 WIB)
    - cron: "0 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -s --max-time 15 "https://nqlazrjcywyltewsxgmx.supabase.co/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -w "\nHTTP %{http_code}" > /tmp/response.txt
          echo "Response:"
          cat /tmp/response.txt
          HTTP_CODE=$(tail -1 /tmp/response.txt | awk '{print $2}')
          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: Supabase returned $HTTP_CODE instead of 200"
            exit 1
          fi
          echo "Supabase DB ping successful — project kept warm"
